name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR when new commits are pushed — rapid
# re-pushes otherwise run every stacked CI to completion and waste Actions
# minutes. main is never cancelled (each push gets its own group via run_id):
# its CI success gates the Fly deploy chain, so we never want a main run killed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Cheap structural gate, deliberately first: a packages/* shared package has to
  # be registered in every place that installs a consumer, and the places that
  # are NOT PR checks (the cron ingests, the release build, the image build) fail
  # weeks later with nothing wrong in the diff that broke them — see the script's
  # header for the three times this has bitten us. Pure Node against a tiny root
  # install, so it reports in well under a minute.
  shared-packages:
    name: shared packages — registration
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # Root devDeps only (the script needs a YAML parser). --ignore-scripts
      # skips husky's `prepare`, which has nothing to set up in CI.
      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Check shared package registration
        run: node scripts/check-shared-package-registration.mjs

  game-core:
    name: game-core — typecheck & test
    runs-on: ubuntu-latest
    # Cap runaway jobs (GitHub's default is 6h) so a hung install/test can't
    # silently drain the Actions budget. This job normally finishes in ~2 min.
    timeout-minutes: 10

    defaults:
      run:
        working-directory: packages/game-core

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/game-core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Run tests with coverage
        run: npm run test:coverage

  binder-routing:
    name: binder-routing — typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: packages/binder-routing

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/binder-routing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Run tests with coverage
        run: npm run test:coverage

  deck-metrics:
    name: deck-metrics — typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: packages/deck-metrics

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/deck-metrics/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Run tests with coverage
        run: npm run test:coverage

  frontend:
    name: Frontend — typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Build the shared file: dependency before installing the consumer:
      # game-core's dist is gitignored, so a fresh checkout has none and the
      # consumer's `npm ci` would otherwise run game-core's build with no
      # devDeps. Building it here makes the dist-guarded prepare a no-op.
      - name: Build shared game-core
        working-directory: packages/game-core
        run: npm ci && npm run build

      - name: Build shared binder-routing
        working-directory: packages/binder-routing
        run: npm ci && npm run build

      - name: Build shared deck-metrics
        working-directory: packages/deck-metrics
        run: npm ci && npm run build

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run tests with coverage
        run: npm run test:coverage

      # The production build was previously exercised ONLY inside
      # backend/Dockerfile, so a build-only break could land on main unnoticed
      # and surface later as a failed Fly deploy or a broken `cap sync` — with
      # prod still serving the old bundle. That is not hypothetical: Vite 8's
      # rolldown entry resolution broke it once, and js-yaml v5 dropping its
      # default export broke it again (#1510) on a PR whose four required
      # checks were all green.
      #
      # docker-image-build.yml can't cover this — it is path-filtered to
      # package.json/package-lock.json/Dockerfile, so it does not run on an
      # ordinary source change (and therefore must never be made a required
      # check: a required check that doesn't report never passes).
      #
      # Cheap and offline: `prebuild` passes --no-fetch to its four refresh
      # scripts, so they keep the committed snapshots and never touch the
      # network — while still importing their dependencies, which is exactly
      # what catches the js-yaml class of break (the imports are top-level, so
      # they run before the --no-fetch bail-out).
      #
      # They used to run unflagged, relying on a 30-day age gate to no-op. That
      # held right up until the gate expired: on 2026-08-30 tagger-tags.json
      # went past 30 days, every build re-fetched the tag corpus from Scryfall,
      # Scryfall answered 429 with 60s cooldowns, and this job died on its
      # 15-minute timeout with nothing wrong with the code. Freshness now
      # belongs to refresh-snapshots.yml, on a schedule, where slow is free.
      - name: Production build
        run: npm run build

  backend:
    name: Backend — typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spellcontrol
          POSTGRES_PASSWORD: spellcontrol
          POSTGRES_DB: spellcontrol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spellcontrol -d spellcontrol"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://spellcontrol:spellcontrol@localhost:5432/spellcontrol
      JWT_SECRET: ci-test-jwt-secret-ci-test-jwt-secret

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # See the frontend job: build the shared file: dependency before the
      # consumer install so its dist-guarded prepare is a no-op.
      - name: Build shared game-core
        working-directory: packages/game-core
        run: npm ci && npm run build

      - name: Build shared binder-routing
        working-directory: packages/binder-routing
        run: npm ci && npm run build

      # Added when the backend took a file: dep on deck-metrics for the AI
      # check_bracket tool. EVERY shared package the consumer depends on needs a
      # step here: without it the consumer's `npm ci` runs that package's
      # dist-guarded prepare with none of its devDependencies present, and the
      # build dies on "TS2688: Cannot find type definition file for 'node'".
      - name: Build shared deck-metrics
        working-directory: packages/deck-metrics
        run: npm ci && npm run build

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run tests with coverage
        run: npm run test:coverage
