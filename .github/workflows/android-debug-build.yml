name: Android debug build

# Guards the native shell the same way docker-image-build.yml guards the
# image: nothing in ci.yml runs `cap sync` + Gradle, so a change that only
# breaks INSIDE the Android build is invisible until a release tag fails.
# That happened on the v0.12.4 cut: the frontend's `postbuild` started
# writing .gz/.br beside every asset (T115 boot-payload work), `cap sync`
# copied them into the Android assets, and AGP's asset merger rejected
# `x.js` + `x.js.gz` as duplicate resources — green on every PR check, red
# on the first release build.
#
# Builds the exact thing android-release.yml builds (same shared-package
# step, same web build against the production origin, same cap sync), just
# unsigned `assembleDebug` instead of `bundleRelease`, and then asserts no
# pre-compressed sibling made it into the APK — the specific regression, so
# it fails loudly even if a future AGP tolerates the duplicates.
#
# Like docker-image-build.yml this is `paths:`-gated, so it never posts a
# check on PRs that don't touch these paths — do NOT add it to the required
# status checks (a required check that never posts leaves the PR stuck).
on:
  push:
    branches: [main]
    paths:
      - 'frontend/android/**'
      - 'frontend/scripts/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/vite.config.ts'
      - 'frontend/capacitor.config.ts'
      - '.github/actions/build-shared/**'
      - '.github/workflows/android-debug-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/android/**'
      - 'frontend/scripts/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/vite.config.ts'
      - 'frontend/capacitor.config.ts'
      - '.github/actions/build-shared/**'
      - '.github/workflows/android-debug-build.yml'

concurrency:
  group: android-debug-build-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # BEFORE the frontend's npm ci — see the action for why.
      - name: Build shared packages
        uses: ./.github/actions/build-shared

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Same origin the release bakes, so the bundle under test is the one
      # that ships (api-base.ts keys the native transport off this value).
      - name: Build web bundle
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://spellcontrol.com
        run: npm run build

      - name: Capacitor sync
        working-directory: frontend
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Assert no pre-compressed assets shipped in the APK
        run: |
          set -euo pipefail
          apk=frontend/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$apk"
          if unzip -l "$apk" | grep -E 'assets/public/.*\.(gz|br)$'; then
            echo "::error::.gz/.br siblings from postbuild are inside the APK — build.gradle's ignoreAssetsPattern must exclude them"
            exit 1
          fi
          echo "no pre-compressed siblings in the APK"
