# Nightly user journey (quality program, 2026-09-09).
#
# CI proves the code type-checks and the unit suites pass over fixtures the
# authors wrote. This proves the APP works: a production build, served the
# way Fly serves it (backend + static bundle), driven by a real Chrome and a
# real Firefox through sign-up → sample collection → deck creation → every
# route, at a phone viewport and a desktop one, failing on any uncaught
# error, console error, horizontal overflow, empty body, or missing title.
# Screenshots + report.json are uploaded whether it passes or fails.
#
# The same job then photographs /dev/catalog (every shared primitive in every
# state) in every theme and every type set, phone and desktop, and compares the crops with the
# previous scheduled run's (T176 W3). See the "Component catalog" steps below.
#
# Not a required check (it runs on a schedule, not on PRs). A red run is a
# defect to file on the board, with the screenshot attached.
name: Nightly journey

on:
  schedule:
    - cron: '17 9 * * *' # daily, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  # Read the previous night's catalog-shots artifact (the diff baseline).
  actions: read

concurrency:
  group: nightly-journey
  cancel-in-progress: true

jobs:
  journey:
    name: Chrome + Firefox journey
    runs-on: ubuntu-latest
    # 50 before the card-cache ingest; the cold ingest streams ~450 MB / ~107k
    # cards (budget 15 min on a cold cache, seconds when restored), so 65.
    timeout-minutes: 65

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spellcontrol
          POSTGRES_PASSWORD: spellcontrol
          POSTGRES_DB: spellcontrol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spellcontrol -d spellcontrol"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://spellcontrol:spellcontrol@localhost:5432/spellcontrol
      JWT_SECRET: nightly-journey-jwt-secret-not-a-secret
      # The Scryfall card cache is the one reference ingest the journey needs:
      # /api/cards/named and /lookup are cache-only, so an empty cache sends
      # every card lookup to the browser's own live api.scryfall.com calls,
      # which throttle a CI runner (Firefox runs last and died on it, E535).
      # The "Ingest Scryfall bulk" step below fills it before the server
      # starts, so the server's own background ingest stays off. The other
      # reference ingests (combos, rules, offline bulk) are hours of network
      # the journey does not read, so they stay off.
      DB_PATH: ${{ github.workspace }}/.scryfall-cache/scryfall-cache.db
      SCRYFALL_BULK_FLUSH_PAUSE_MS: '0'
      SCRYFALL_BULK_INGEST_DISABLED: '1'
      COMBOS_INGEST_DISABLED: '1'
      RULES_INGEST_DISABLED: '1'
      OFFLINE_BULK_DISABLED: '1'
      UPTIME_HEARTBEAT_DISABLED: '1'

    steps:
      # No LFS: the only LFS object is the scanner's card-embeddings.bin, and
      # the matcher logs a warning and disables the scanner endpoint when it
      # is missing (scanner/matcher.ts). The journey never scans a card.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Build shared packages
        uses: ./.github/actions/build-shared

      - name: Install
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
          npm ci --prefix backend --no-audit --no-fund

      # Daily-ish cache of the card DB + its meta file (not the downloaded
      # dump, which the ingest deletes). The key carries the UTC date so a
      # new day re-saves; restore-keys fall back to the latest earlier day.
      # The ingest's 20h recency guard then skips or tops up a restored cache.
      - name: Scryfall cache key
        id: scryfall_day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore the Scryfall card cache
        id: scryfall_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .scryfall-cache/scryfall-cache.db
            .scryfall-cache/scryfall-bulk.meta.json
          key: scryfall-bulk-${{ runner.os }}-${{ steps.scryfall_day.outputs.day }}
          restore-keys: |
            scryfall-bulk-${{ runner.os }}-

      # Same build the Docker image ships: prebuild keeps the committed
      # snapshots (--no-fetch), postbuild writes the pre-compressed siblings.
      - name: Build the frontend
        run: npm run build --prefix frontend

      # Vite honors a pre-set NODE_ENV during `vite build`: with NODE_ENV=
      # development in scope, import.meta.env.DEV is true and the bundle bakes
      # the dev-server proxy paths (/edhrec-api, /scryfall-api) that only Vite
      # serves — every EDHREC and Scryfall call then 404s against the backend
      # and the commander picker reads "No commanders found" (first run, E278).
      # NODE_ENV=development is scoped to the backend step below for that reason.
      - name: Assert the bundle is a production build
        run: |
          if grep -rlE --include='*.js' '/(edhrec|scryfall)-api' frontend/dist; then
            echo '::error::dev-server proxy paths in the bundle — NODE_ENV leaked into the frontend build'
            exit 1
          fi

      # Runs the server's own ingest to completion (backend/src/scripts).
      # --if-stale honors the 20h guard, so a cache restored from last night
      # is not re-streamed. Fails the job on any error or an empty dump.
      - name: Ingest Scryfall bulk card data
        run: |
          start=$(date +%s)
          npm run ingest:scryfall-bulk --prefix backend -- --if-stale
          echo "ingest took $(( $(date +%s) - start ))s"
          ls -l .scryfall-cache

      # Saved straight after the ingest, before the server opens the DB (no
      # live WAL). A hit on the exact key is a no-op save.
      - name: Save the Scryfall card cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .scryfall-cache/scryfall-cache.db
            .scryfall-cache/scryfall-bulk.meta.json
          key: scryfall-bulk-${{ runner.os }}-${{ steps.scryfall_day.outputs.day }}

      # server.ts serves backend/public when it exists — the Dockerfile copies
      # frontend/dist there; a symlink is the same thing here.
      - name: Start the backend serving the bundle
        # development: plain-http localhost needs non-Secure auth cookies (auth.ts).
        env:
          NODE_ENV: development
        run: |
          ln -s "$PWD/frontend/dist" backend/public
          (cd backend && nohup ./node_modules/.bin/tsx src/server.ts > ../backend.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:3737/health > /dev/null && exit 0
            sleep 2
          done
          echo "backend never answered /health"; cat backend.log; exit 1

      # The journey's fixed account has to be an admin for the walk to cover
      # /admin. Admin is seeded from VERIFIED emails now (ADMIN_EMAILS), and
      # this account can't receive mail, so the seat is granted out-of-band
      # here instead: register through the real endpoint, then promote with
      # one UPDATE. The same UPDATE marks the address verified, which both
      # matches what a real account looks like after clicking the link and
      # keeps the recovery banner off every screenshot. The journey itself
      # sees a 409 and signs in, exactly as it already does on any re-run
      # against a warm database.
      - name: Seed the journey's admin account
        env:
          PGPASSWORD: spellcontrol
        run: |
          curl -s -o /dev/null -X POST http://localhost:3737/api/auth/register -H 'Content-Type: application/json' -d '{"username":"journeyadmin","password":"journey-pass-journeyadmin","email":"journeyadmin@example.com"}'
          psql -h localhost -U spellcontrol -d spellcontrol -c "UPDATE users SET role = 'admin', email = 'journeyadmin@example.com', email_verified = true WHERE username = 'journeyadmin'"

      # --a11y: axe on every screen plus a contrast sweep of every theme and
      # type set and a keyboard Tab walk (desktop). A finding fails the run;
      # journey-chrome/a11y.json names the rule, element and screens.
      - name: Journey in Chrome (phone + desktop)
        run: node scripts/journey.mjs --base http://localhost:3737 --browser chrome --username journeyadmin --a11y --out journey-chrome

      - name: Journey in Firefox (desktop)
        if: always()
        run: node scripts/journey.mjs --base http://localhost:3737 --browser firefox --viewports desktop --username journeyadmin --out journey-firefox

      # ── Component catalog visual diff (T176 W3) ─────────────────────────
      # /dev/catalog renders every shared primitive in every state. One crop per
      # section per (theme, type set) pair per viewport is compared with the previous
      # scheduled run on main. The baseline is that run's uploaded artifact, not
      # a file in git (no PNG baselines in the repo). It is picked by artifact
      # existence, not run conclusion, so a night that FAILS on a change still
      # becomes the next night's baseline: one red run per pixel change, then
      # green again. A red run here means "a primitive looks different than it
      # did yesterday": check the catalog-diff artifact and either accept it
      # (an intended restyle) or file a board row.
      - name: Photograph the component catalog
        if: always()
        run: node scripts/catalog-shots.mjs --base http://localhost:3737 --browser chrome --out catalog-shots

      - name: Fetch the previous catalog shots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p catalog-baseline
          prev=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq "[.artifacts[] | select((.name | startswith(\"catalog-shots-\")) and (.expired | not) and .workflow_run.head_branch == \"main\" and (.workflow_run.id != $GITHUB_RUN_ID))] | sort_by(.created_at) | last | .name // empty")
          if [ -z "$prev" ]; then echo "no earlier catalog-shots artifact; nothing to compare"; exit 0; fi
          run_id=${prev#catalog-shots-}
          gh run download "$run_id" --name "$prev" --dir catalog-baseline

      - name: Compare the catalog with the previous run
        id: catalog_diff
        if: always()
        run: node scripts/catalog-diff.mjs --baseline catalog-baseline --current catalog-shots --out catalog-diff

      - name: Upload the catalog shots (next night's baseline)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-shots-${{ github.run_id }}
          path: catalog-shots
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload the catalog diffs
        if: always() && steps.catalog_diff.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-diff-${{ github.run_id }}
          path: catalog-diff
          retention-days: 14

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: journey-${{ github.run_id }}
          path: |
            journey-chrome
            journey-firefox
            backend.log
          retention-days: 14
