name: Deploy to Fly

# Chained off the CI workflow's success on `main`. Pushing to main triggers
# CI; once CI's typecheck + lint + tests all pass, this workflow fires and
# `flyctl deploy --remote-only` ships the new image to the spellcontrol-api
# app. PRs do not deploy — they only run CI.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  # Manual fallback for re-deploying without a code change (e.g. after a
  # rotated secret) and for the first run before CI catches up.
  workflow_dispatch:

# Only one Fly deploy may be in flight at a time. Queue rather than
# cancel-in-progress: each push to main should be deployed in order.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  # A gated-off deploy is INVISIBLE: when CI fails on main, `deploy` below is
  # simply skipped and the whole run reports `completed skipped`, which reads
  # identically to "nothing to do". That silence is the expensive part — main
  # keeps serving the PREVIOUS build (this one Fly app serves the API *and*
  # the SPA), and nobody finds out until someone goes looking for a feature
  # that isn't there. It has happened: a fully-green suite can still exit 1 on
  # the vitest teardown flake (`EnvironmentTeardownError: Closing rpc while
  # "onUserConsoleLog" was pending`), which reds main CI and silently strands
  # the merge undeployed.
  #
  # This job turns that silence into a red "Deploy to Fly" run naming the
  # recovery command. It does NOT auto-rerun CI: when the failure is real,
  # retrying just burns a cycle and fails again, and telling flake from real
  # failure needs log-sniffing this doesn't want to own.
  not-deployed:
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report that main is undeployed
        # Passed via env rather than inlined into the script: these two are
        # GitHub-controlled (an enum and a numeric id), but `run:` interpolation
        # is the workflow-injection footgun, so keep the safe shape by default.
        env:
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          echo "::error title=main is NOT deployed::CI concluded '${CI_CONCLUSION}' on main, so the Fly deploy was skipped. Production is still running the previous build."
          echo "Recover by re-running the failed CI jobs — a green CI re-fires this deploy on its own:"
          echo "  gh run rerun ${CI_RUN_ID} --failed"
          echo ""
          echo "If the CI failure is the vitest teardown flake (every test passes, job still exits 1"
          echo "on a single unhandled rejection), the re-run is the whole fix."
          exit 1

  deploy:
    # workflow_run fires on both success and failure; gate on success only.
    # The workflow_dispatch path has no workflow_run context, so allow it
    # unconditionally.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # lfs: true is load-bearing — card-embeddings.bin (28 MB) is Git-LFS
      # tracked. Without it the checkout yields a 133-byte LFS pointer, which
      # ships to Fly and makes the scanner matcher throw "bad magic" at boot
      # → every /api/scanner/match fails and clients fall back to weak pHash.
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
